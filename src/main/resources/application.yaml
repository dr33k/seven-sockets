spring:
  cloud:
    compatibility-verifier:
      enabled: false

  #KAFKA CONFIG
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # High-performance settings
      acks: 1 # Faster than 'all', good enough for presence
      properties:
        linger.ms: 5 # Wait 5ms to batch messages
        compression.type: lz4 # Best balance of speed/compression for Java 25
    consumer:
      group-id: presence-persistence-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ["com.seven.auth.*", "com.seven.sockets.*"]

  #REDIS CONFIG
  data:
    redis:
      host: localhost
      port: 6379
      # Using Lettuce (default in Spring) for non-blocking I/O
      lettuce:
        pool:
          max-active: 100

  #DATASOURCE CONFIG FOR FLYWAY
  datasource:
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:root}
    url: jdbc:postgresql://localhost:${PG_PORT:5432}/acct_profile_db
    hikari:
      auto-commit: false

  #DATASOURCE CONFIG FOR R2DBC
  r2dbc:
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:root}
    url: r2dbc:postgresql://localhost:${PG_PORT:5432}/acct_profile_db
    pool:
      initial-size: 10
      max-size: 30