services:
#------------------SOCKETS-PRESENCE-------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: redis-cache
    ports:
      - "6379:6379"   # Redis Port
      - "8001:8001"   # RedisInsight GUI Port
    environment:
      - REDIS_ARGS=--save 60 1  # Snapshot every 60s if 1 key changes
    volumes:
      - ./redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  sockets-db-postgres:
    image: postgres:16-alpine
    container_name: sockets-db-postgres
    environment:
      POSTGRES_DB: sockets_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sockets-app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sockets_db"]
      interval: 5s
      timeout: 5s
      retries: 5

#------------------SOCKETS-MESSAGING-------------------------------------------------
  sockets-db-mongodb:
    image: mongo:7.0
    container_name: sockets-db-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

