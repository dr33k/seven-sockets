#    container_name: seven-sockets
#    depends_on:
#      acct-profile-db-postgres:
#        condition: service_healthy
#    ports:
#      - "8080:8080"
#    networks:
#      - sockets-app-net
#    environment:
#      JDBC_DATASOURCE_URL: jdbc:postgresql://acct-profile-db-postgres:5432/acct_profile_db
#      R2DBC_DATASOURCE_URL: r2dbc:postgresql://acct-profile-db-postgres:5432/acct_profile_db

networks:
  sockets-app-net:
    driver: bridge

volumes:
  postgres_data:
  redis-data:
    driver: local